version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "5.0"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "6.0"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
