version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    target-branch: "6.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    target-branch: "5.0"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    target-branch: "6.0"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    target-branch: "5.0"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Etc/GMT"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: "6.0"
    commit-message:
      prefix: "build(repo)"
      prefix-development: "build(repo)"
      include: "scope"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "07:00"
      timezone: "Etc/GMT"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: "5.0"
    commit-message:
      prefix: "build(repo)"
      prefix-development: "build(repo)"
      include: "scope"
