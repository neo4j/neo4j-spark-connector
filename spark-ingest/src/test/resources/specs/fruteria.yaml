---
version: '1'
targets:
    nodes:
        - source: 'customer'
          name: 'customer_nodes'
          write_mode: 'merge'
          labels:
              - 'Customer'
          properties:
              - source_field: 'customer_id'
                target_property: 'customerId'
                target_property_type: 'string'
              - source_field: 'full_name'
                target_property: 'fullName'
                target_property_type: 'string'
          schema:
              key_constraints:
                  - name: 'customer_id_key'
                    label: 'Customer'
                    properties:
                        - 'customerId'
              type_constraints:
                  - name: 'customer_id_type'
                    label: 'Customer'
                    property: 'customerId'
                  - name: 'customer_full_name_type'
                    label: 'Customer'
                    property: 'fullName'
        - source: 'invoice'
          name: 'invoice_nodes'
          write_mode: 'merge'
          labels:
              - 'Invoice'
          properties:
              - source_field: 'invoice_id'
                target_property: 'invoiceId'
                target_property_type: 'string'
          schema:
              key_constraints:
                  - name: 'invoice_id_key'
                    label: 'Invoice'
                    properties:
                        - 'invoiceId'
              type_constraints:
                  - name: 'invoice_id_type'
                    label: 'Invoice'
                    property: 'invoiceId'
        - source: 'sku'
          name: 'sku_nodes'
          write_mode: 'merge'
          labels:
              - 'Sku'
          properties:
              - source_field: 'sku_id'
                target_property: 'skuId'
                target_property_type: 'string'
              - source_field: 'description'
                target_property: 'description'
                target_property_type: 'string'
          schema:
              key_constraints:
                  - name: 'sku_id_key'
                    label: 'Sku'
                    properties:
                        - 'skuId'
              type_constraints:
                  - name: 'sku_id_type'
                    label: 'Sku'
                    property: 'skuId'
                  - name: 'sku_description_type'
                    label: 'Sku'
                    property: 'description'
        - source: 'fruit'
          name: 'fruit_type_nodes'
          write_mode: 'merge'
          labels:
              - 'Fruit Type'
          properties:
              - source_field: 'fruit_type'
                target_property: 'type'
                target_property_type: 'string'
          schema:
              key_constraints:
                  - name: 'fruit_type_key'
                    label: 'Fruit Type'
                    properties:
                        - 'type'
              type_constraints:
                  - name: 'fruit_type_type'
                    label: 'Fruit Type'
                    property: 'type'
    relationships:
        - source: 'ordered'
          name: 'customer_ordered_invoice'
          write_mode: 'create'
          node_match_mode: 'match'
          type: 'ORDERED'
          start_node_reference:
              name: 'customer_nodes'
              key_mappings:
                  - source_field: 'customer_id'
                    node_property: 'customerId'
          end_node_reference:
              name: 'invoice_nodes'
              key_mappings:
                  - source_field: 'invoice_id'
                    node_property: 'invoiceId'
        - source: 'ordered'
          name: 'invoice_ordered_by_customer'
          write_mode: 'create'
          node_match_mode: 'match'
          type: 'ORDERED_BY'
          start_node_reference:
              name: 'invoice_nodes'
              key_mappings:
                  - source_field: 'invoice_id'
                    node_property: 'invoiceId'
          end_node_reference:
              name: 'customer_nodes'
              key_mappings:
                  - source_field: 'customer_id'
                    node_property: 'customerId'
        - source: 'has'
          name: 'invoice_contains_sku'
          write_mode: 'create'
          node_match_mode: 'match'
          type: 'CONTAINS'
          start_node_reference:
              name: 'invoice_nodes'
              key_mappings:
                  - source_field: 'invoice_id'
                    node_property: 'invoiceId'
          end_node_reference:
              name: 'sku_nodes'
              key_mappings:
                  - source_field: 'sku_id'
                    node_property: 'skuId'
        - source: 'typed'
          name: 'sku_of_type_fruit'
          write_mode: 'create'
          node_match_mode: 'match'
          type: 'OF_TYPE'
          start_node_reference:
              name: 'sku_nodes'
              key_mappings:
                  - source_field: 'sku_id'
                    node_property: 'skuId'
          end_node_reference:
              name: 'fruit_type_nodes'
              key_mappings:
                  - source_field: 'fruit_type'
                    node_property: 'type'
